<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="siengeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF8F33" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#0F0F0F" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado Moderno -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Linhas de Conexão da Comunidade (Rede) -->
  <g stroke="#FF8F33" stroke-width="4" stroke-opacity="0.4" fill="none">
    <line x1="160" y1="280" x2="256" y2="210" />
    <line x1="352" y1="280" x2="256" y2="210" />
    <line x1="160" y1="280" x2="352" y2="280" />
  </g>

  <!-- Ícone Principal: Capacete de Segurança Estilizado -->
  <path d="M 256 120 
           C 170 120 120 180 120 240 
           C 120 255 132 265 146 265 
           L 366 265 
           C 380 265 392 255 392 240 
           C 392 180 342 120 256 120 Z" 
        fill="url(#siengeGrad)" />
  
  <!-- Aba do Capacete -->
  <path d="M 90 280 
           C 90 265 105 260 120 260 
           L 392 260 
           C 407 260 422 265 422 280 
           C 422 295 407 305 392 305 
           L 120 305 
           C 105 305 90 295 90 280 Z" 
        fill="#E05B00" />

  <!-- Nós de Conexão / Pessoas na Rede (Pontos Brancos) -->
  <circle cx="256" cy="210" r="12" fill="#FFFFFF" />
  <circle cx="160" cy="280" r="10" fill="#FFFFFF" />
  <circle cx="352" cy="280" r="10" fill="#FFFFFF" />

  <!-- Detalhe Inferior Simbolizando Base/Prancheta/Concreto -->
  <path d="M 170 350 L 342 350 C 352 350 360 358 360 368 L 360 372 C 360 382 352 390 342 390 L 170 390 C 160 390 152 382 152 372 L 152 368 C 152 358 160 350 170 350 Z" fill="#4A4A4A" />
</svg>
